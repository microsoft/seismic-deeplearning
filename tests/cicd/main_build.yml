# Pull request against these branches will trigger this build
pr:
- master
- staging

# Any commit to this branch will trigger the build.
trigger:
- master
- staging

variables:
  Agent: $(AgentName)

jobs:
# partially disable setup for now - done manually on build VM
- job: setup

  displayName: Setup
  pool:
    name: $(Agent)

  steps:
  - bash: |
      echo "Running setup..."

      pwd
      ls
      git branch
      uname -ra

      # make sure we have the latest and greatest
      # yes | conda env update -f environment/anaconda/local/environment.yml
      conda activate seismic-interpretation
      pip install -e interpretation
      pip install -e cv_lib
      # add this if pytorch stops detecting GPU
      # conda install pytorch torchvision cudatoolkit=9.2 -c pytorch
  
      # copy your model files like so - using dummy file to illustrate
      azcopy --quiet --source:https://$(storagename).blob.core.windows.net/models/model --source-key $(storagekey) --destination ./models/your_model_name
    displayName: Setup
    failOnStderr: True

  - bash: |
      echo "Starting unit tests"
      conda activate seismic-interpretation
      pytest --durations=0 cv_lib/tests/
      echo "Unit test job passed"
    displayName: Unit Tests Job

###################################################################################################
# LOCAL PATCH JOBS
###################################################################################################

  - bash: |
      conda activate seismic-interpretation
      # run the tests      
      cd experiments/interpretation/dutchf3_patch/local
      python train.py --cfg=configs/hrnet.yaml 'DATASET.ROOT' './data/dutch_f3/data' 'TRAIN.END_EPOCH' 1 'TRAIN.SNAPSHOTS' 1
      # find the latest model which we just trained
      model=$(ls -td */*/*/hrnet/* | head -1)
      # try running the test script
      python test.py --cfg=configs/hrnet.yaml 'DATASET.ROOT' './data/dutch_f3/data' 'TEST.MODEL_PATH' ${model}/models/hrnet_running_model_1.pth
    displayName: hrnet patch

  - bash: |
      conda activate seismic-interpretation
      # run the tests      
      cd experiments/interpretation/dutchf3_patch/local
      python train.py --cfg=configs/unet.yaml 'DATASET.ROOT' './data/dutch_f3/data' 'TRAIN.END_EPOCH' 1 'TRAIN.SNAPSHOTS' 1
      # find the latest model which we just trained
      model=$(ls -td */*/*/unet/* | head -1)
      # try running the test script
      python test.py --cfg=configs/unet.yaml 'DATASET.ROOT' './data/dutch_f3/data' 'TEST.MODEL_PATH' ${model}/models/unet_running_model_1.pth
    displayName: unet patch

  - bash: |
      conda activate seismic-interpretation
      # run the tests      
      cd experiments/interpretation/dutchf3_patch/local
      python train.py --cfg=configs/seresnet_unet.yaml 'DATASET.ROOT' './data/dutch_f3/data' 'TRAIN.END_EPOCH' 1 'TRAIN.SNAPSHOTS' 1
      # find the latest model which we just trained
      model=$(ls -td */*/*/seresnet_unet/* | head -1)
      # try running the test script
      python test.py --cfg=configs/seresnet_unet.yaml 'DATASET.ROOT' './data/dutch_f3/data' 'TEST.MODEL_PATH' ${model}/models/seresnet_unet_running_model_1.pth
    displayName: seresnet unet patch

  - bash: |
      conda activate seismic-interpretation
      # run the tests      
      cd experiments/interpretation/dutchf3_patch/local
      python train.py --cfg=configs/patch_deconvnet.yaml 'DATASET.ROOT' './data/dutch_f3/data' 'TRAIN.END_EPOCH' 1 'TRAIN.SNAPSHOTS' 1
      # find the latest model which we just trained
      model=$(ls -td */*/*/patch_deconvnet/* | head -1)
      # try running the test script
      python test.py --cfg=configs/patch_deconvnet.yaml 'DATASET.ROOT' './data/dutch_f3/data' 'TEST.MODEL_PATH' ${model}/models/patch_deconvnet_running_model_1.pth
    displayName: patch deconvnet

  - bash: |
      conda activate seismic-interpretation
      # run the tests      
      cd experiments/interpretation/dutchf3_patch/local
      python train.py --cfg=configs/patch_deconvnet_skip.yaml 'DATASET.ROOT' './data/dutch_f3/data' 'TRAIN.END_EPOCH' 1 'TRAIN.SNAPSHOTS' 1
      # find the latest model which we just trained
