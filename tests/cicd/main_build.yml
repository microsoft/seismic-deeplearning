    displayName: patch deconvnet skip

# Penobscot dataset
  - bash: |
      conda activate seismic-interpretation
      # run the tests      
      cd experiments/interpretation/penobscot/local
      python train.py --cfg=configs/seresnet_unet.yaml 'DATASET.ROOT' './data/penobscot' 'TRAIN.END_EPOCH' 1 'TRAIN.SNAPSHOTS' 1
      # find the latest model which we just trained
      model=$(ls -td */*/*/seresnet_unet/* | head -1)
      # try running the test script
      python test.py --cfg=configs/seresnet_unet.yaml 'DATASET.ROOT' './data/penobscot' 'TEST.MODEL_PATH' ${model}/models/seresnet_unet_running_model_1.pth
    displayName: seresnet unet

  - bash: |
      conda activate seismic-interpretation
      # run the tests      
      cd experiments/interpretation/penobscot/local
      python train.py --cfg=configs/hrnet.yaml 'DATASET.ROOT' './data/penobscot' 'TRAIN.END_EPOCH' 1 'TRAIN.SNAPSHOTS' 1
      # find the latest model which we just trained
      model=$(ls -td */*/*/hrnet/* | head -1)
      # try running the test script
      python test.py --cfg=configs/hrnet.yaml 'DATASET.ROOT' './data/penobscot' 'TEST.MODEL_PATH' ${model}/models/hrnet_running_model_1.pth
    displayName: hrnet penobscot
###################################################################################################
# DISTRIBUTED PATCH JOBS
###################################################################################################

  - bash: |
      conda activate seismic-interpretation
      export PYTHONPATH="$PWD/interpretation:$PYTHONPATH"
      # run the tests      
      cd experiments/interpretation/dutchf3_patch/distributed
      python -m torch.distributed.launch --nproc_per_node=$(nproc) train.py --cfg=configs/hrnet.yaml 'DATASET.ROOT' './data/dutch_f3/data' 'TRAIN.END_EPOCH' 1 'TRAIN.SNAPSHOTS' 1
    displayName: hrnet patch

