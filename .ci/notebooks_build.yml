resources:
  repositories:
    - repository: aitemplates
      type: github
      name: microsoft/AI
      endpoint: AIArchitecturesAndPractices-GitHub

# Pull request against these branches will trigger this build
pr:
- master
- staging

# Any commit to this branch will trigger the build.
trigger:
- master
- staging

jobs:

# partially disable setup for now - done manually on build VM
- job:  azureml_deviot_notebooks
  timeoutInMinutes: 10
  displayName: Setup
  pool:
    name: $(AgentName)

  steps:
  - template: steps/setup_step.yml
    parameters:
      storagename: $(storagename)
      storagekey: $(storagekey)

  - bash: |
      echo "azureml_deviot_notebooks"
      cd examples/imaging/azureml_deviot_notebooks/
      papermill 000_Setup_GeophysicsTutorial_FWI_Azure_devito.ipynb 000_Setup_GeophysicsTutorial_FWI_Azure_devito_Output.ipynb \
        --log-output \
        -k python3

  - bash: |
      source activate seismic-interpretation
      echo "azureml_deviot_notebooks"
      cd examples/imaging/azureml_deviot_notebooks/
      papermill 010_CreateExperimentationDockerImage_GeophysicsTutorial_FWI_Azure_devito.ipynb 010_CreateExperimentationDockerImage_GeophysicsTutorial_FWI_Azure_devito_Output.ipynb\
        --log-output \
        -k python3

  - bash: |
      source activate seismic-interpretation
      echo "azureml_deviot_notebooks"
      cd examples/imaging/azureml_deviot_notebooks/
      papermill 020_UseAzureMLEstimatorForExperimentation_GeophysicsTutorial_FWI_Azure_devito.ipynb 020_UseAzureMLEstimatorForExperimentation_GeophysicsTutorial_FWI_Azure_devito_Output.ipynb
        --log-output \
        -k python3

- job: F3_block_training_and_evaluation_local
  timeoutInMinutes: 10
  displayName: F3 block training and evaluation local
  pool:
    name: $(AgentName)
  steps:
  - template: steps/setup_step.yml
    parameters:
      storagename: $(storagename)
      storagekey: $(storagekey)

  - bash: |
      source activate seismic-interpretation
      echo "azureml_deviot_notebooks"
      cd examples/interpretation/notebooks/
      papermill F3_block_training_and_evaluation_local.ipynb F3_block_training_and_evaluation_local_Output.ipynb \
        --log-output \
        -k python3

- job: HRNet_demo_notebook
  timeoutInMinutes: 10
  displayName: F3 block training and evaluation local
  pool:
    name: $(AgentName)
  steps:
  - template: steps/setup_step.yml
    parameters:
      storagename: $(storagename)
      storagekey: $(storagekey)

  - bash: |
      source activate seismic-interpretation
      echo "azureml_deviot_notebooks"
      cd examples/interpretation/notebooks/
      papermill HRNet_demo_notebook.ipynb HRNet_demo_notebook_Ouptut.ipynb \
        --log-output \
        -k python3
