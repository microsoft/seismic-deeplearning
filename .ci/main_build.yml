# Pull request against these branches will trigger this build
pr:
- master
- staging

# Any commit to this branch will trigger the build.
trigger:
- master
- staging

variables:
  Agent: $(AgentName)

jobs:
# partially disable setup for now - done manually on build VM
- job: unit_tests

  variables:
    conda: seismic-interpretation
    dutchf3_patch: experiments/interpretation/dutchf3_patch/local
    patch_root: ./data/dutch_f3/data
    penobscot: experiments/interpretation/penobscot/local
    penobscot_root: ./data/penobscot

  displayName: Setup
  pool:
    name: $(Agent)

  steps:
  - bash: |
      echo "Running setup..."

      pwd
      ls
      git branch
      uname -ra

      # make sure we have the latest and greatest
      conda env create -f environment/anaconda/local/environment.yml --force
      source activate $(conda)
      pip install -e interpretation
      pip install -e cv_lib
      # add this if pytorch stops detecting GPU
      # conda install pytorch torchvision cudatoolkit=9.2 -c pytorch
  
      # copy your model files like so - using dummy file to illustrate
      azcopy --quiet --source:https://$(storagename).blob.core.windows.net/models/model --source-key $(storagekey) --destination ./models/your_model_name
    displayName: Setup
    failOnStderr: True

  - template: setup.yml
    parameters:
      storagename: $(storagename)
      storagekey: $(storagekey)

  - bash: |
      echo "Starting unit tests"
      source activate seismic-interpretation
      pytest --durations=0 --junitxml 'reports/test-unit.xml' cv_lib/tests/ 
      echo "Unit test job passed"
    displayName: Unit Tests Job
    failOnStderr: True


# LOCAL PATCH Steps
  - template: local_patch_steps.yml

###################################################################################################
# DISTRIBUTED PATCH JOBS
###################################################################################################

  - template: python_train_test.yml
    parameters:
      conda: $(conda)
      dir: $(penobscot)
      dataset_root: $(penobscot_root)
      model_name: hrnet

  - bash: |
      source activate seismic-interpretation
      export PYTHONPATH="$PWD/interpretation:$PYTHONPATH"
      # run the tests      
      cd experiments/interpretation/dutchf3_patch/distributed
      python -m torch.distributed.launch --nproc_per_node=$(nproc) train.py --cfg=configs/hrnet.yaml 'DATASET.ROOT' './data/dutch_f3/data' 'TRAIN.END_EPOCH' 1 'TRAIN.SNAPSHOTS' 1
    displayName: hrnet patch

  - bash: |
      source activate seismic-interpretation
      export PYTHONPATH="$PWD/interpretation:$PYTHONPATH"
      # run the tests      
      cd experiments/interpretation/dutchf3_patch/distributed
      python -m torch.distributed.launch --nproc_per_node=$(nproc) train.py --cfg=configs/unet.yaml 'DATASET.ROOT' './data/dutch_f3/data' 'TRAIN.END_EPOCH' 1 'TRAIN.SNAPSHOTS' 1      
    displayName: unet patch

  - bash: |
      source activate seismic-interpretation
      export PYTHONPATH="$PWD/interpretation:$PYTHONPATH"
      # run the tests      
      cd experiments/interpretation/dutchf3_patch/distributed
      python -m torch.distributed.launch --nproc_per_node=$(nproc) train.py --cfg=configs/seresnet_unet.yaml 'DATASET.ROOT' './data/dutch_f3/data' 'TRAIN.END_EPOCH' 1 'TRAIN.SNAPSHOTS' 1
    displayName: seresnet unet patch

  - bash: |
      source activate seismic-interpretation
      export PYTHONPATH="$PWD/interpretation:$PYTHONPATH"
      # run the tests      
      cd experiments/interpretation/dutchf3_patch/distributed
      python -m torch.distributed.launch --nproc_per_node=$(nproc) train.py --cfg=configs/patch_deconvnet.yaml 'DATASET.ROOT' './data/dutch_f3/data' 'TRAIN.END_EPOCH' 1 'TRAIN.SNAPSHOTS' 1  
    displayName: patch deconvnet

  - bash: |
      source activate seismic-interpretation
      export PYTHONPATH="$PWD/interpretation:$PYTHONPATH"
      # run the tests      
      cd experiments/interpretation/dutchf3_patch/distributed
      python -m torch.distributed.launch --nproc_per_node=$(nproc) train.py --cfg=configs/patch_deconvnet_skip.yaml 'DATASET.ROOT' './data/dutch_f3/data' 'TRAIN.END_EPOCH' 1 'TRAIN.SNAPSHOTS' 1
    displayName: patch deconvnet skip

###################################################################################################
# LOCAL SECTION JOBS
###################################################################################################

  - bash: |
      source activate seismic-interpretation
      # run the tests      
      cd experiments/interpretation/dutchf3_section/local
      python train.py --cfg=configs/section_deconvnet_skip.yaml 'DATASET.ROOT' './data/dutch_f3/data' 'TRAIN.END_EPOCH' 1 'TRAIN.SNAPSHOTS' 1
      # find the latest model which we just trained
      model=$(ls -td */*/*/section_deconvnet_skip/* | head -1)
      # try running the test script
      python test.py --cfg=configs/section_deconvnet_skip.yaml 'DATASET.ROOT' './data/dutch_f3/data' 'TEST.MODEL_PATH' ${model}/models/section_deconvnet_skip_running_model_1.pth
    displayName: section deconvnet skip

  - task: PublishTestResults@2
    displayName: 'Publish Test Results **/test-*.xml'
    inputs:
      testResultsFiles: '**/test-*.xml'
      failTaskOnFailedTests: true
    condition: succeededOrFailed()
