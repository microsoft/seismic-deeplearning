  
parameters:  
  conda: # seismic-interpretation
  dir: # experiments/interpretation/dutchf3_patch/distributed
  dataset_root: # './data/dutch_f3/data'
  model_name: # hrnet
  nproc: #

steps:
- bash: |
    source activate ${{parameters.conda}}
    export PYTHONPATH="$PWD/interpretation:$PYTHONPATH"
    # run the tests      
    cd ${{parameters.dir}}
    python -m torch.distributed.launch --nproc_per_node=${{parameters.nproc}} train.py --cfg=configs/${{parameters.model_name}}.yaml 'DATASET.ROOT' '${{parameters.dataset_root}}' 'TRAIN.END_EPOCH' 1 'TRAIN.SNAPSHOTS' 1
  displayName: ${{parameters.model_name}} patch
  failOnStderr: True
