
parameters:
  dutchf3_patch: experiments/interpretation/dutchf3_patch/local
  patch_root: ./data/dutch_f3/data
  penobscot: experiments/interpretation/penobscot/local
  penobscot_root: ./data/penobscot

steps:
  - template: local_patch_step.yml
    parameters:
      dir: $(dutchf3_patch)
      dataset_root: $(patch_root)
      model_name: hrnet

  - template: local_patch_step.yml
    parameters:
      dir: $(dutchf3_patch)
      dataset_root: $(patch_root)
      model_name: unet

  - template: local_patch_step.yml
    parameters:
      dir: $(dutchf3_patch)
      dataset_root: $(patch_root)
      model_name: seresnet_unet

  - template: local_patch_step.yml
    parameters:
      dir: $(dutchf3_patch)
      dataset_root: $(patch_root)
      model_name: patch_deconvnet

  - template: local_patch_step.yml
    parameters:
      dir: $(dutchf3_patch)
      dataset_root: $(patch_root)
      model_name: patch_deconvnet_skip

# Local Section
  - template: local_patch_step.yml
    parameters:
      dir: $(dutchf3_patch)
      dataset_root: $(patch_root)
      model_name: section_deconvnet_skip

# Penobscot dataset
  - template: local_patch_step.yml
    parameters:
      dir: $(penobscot)
      dataset_root: $(penobscot_root)
      model_name: seresnet_unet

  - template: local_patch_step.yml
    parameters:
      dir: $(penobscot)
      dataset_root: $(penobscot_root)
      model_name: hrnet
