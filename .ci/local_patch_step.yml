  
parameters:  
  conda: seismic-interpretation
  dir: #
  dataset_root: # './data/dutch_f3/data'
  model_name: # hrnet
  model_path: # /models/hrnet_running_model_1.pth

steps:
  - bash: |
      source activate ${{parameters.conda}}
      # run the tests      
      cd ${{parameters.dir}}
      python train.py --cfg=configs/${{parameters.model_name}}.yaml 'DATASET.ROOT' '${{parameters.dataset_root}}' 'TRAIN.END_EPOCH' 1 'TRAIN.SNAPSHOTS' 1
      # find the latest model which we just trained
      model=$(ls -td */*/*/${{parameters.model_name}}/* | head -1)
      # try running the test script
      python test.py --cfg=configs/${{parameters.model_name}}.yaml 'DATASET.ROOT' '${{parameters.dataset_root}}' 'TEST.MODEL_PATH' ${model}/models/${{parameters.model_name}}_running_model_1.pth
    displayName: ${{parameters.model_name}} patch
